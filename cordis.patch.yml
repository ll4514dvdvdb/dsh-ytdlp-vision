- insert:
    - id: ytdlp-vision
      name: 'ytdlp-vision'
      inject: [tools]
      config:
        # python 留空 = 自动探测（DSH 自带 3.12 → ~/.dsh/*-venv → PATH）。
        # 想固定解释器就填绝对路径，或设环境变量 YTDLP_VISION_PYTHON。
        defaultPolicy: auto
        timeoutMs: 1800000
        updateOnBoot: true
        updateIntervalHours: 0
